common:
  timeout: 180
  min_ram: 34
  tags:
    - kernel
    - threads
    - scheduler
    - userspace
  ignore_faults: true
tests:
  kernel.scheduler:
    filter: not CONFIG_SCHED_MULTIQ
    extra_configs:
      - CONFIG_TIMESLICING=y
  kernel.scheduler.no_timeslicing:
    filter: not CONFIG_SCHED_MULTIQ
    extra_configs:
      - CONFIG_TIMESLICING=n
  kernel.scheduler.slice_perthread:
    filter: not CONFIG_SCHED_MULTIQ
    extra_configs:
      - CONFIG_TIMESLICING=y
      - CONFIG_TIMESLICE_PER_THREAD=y
      - CONFIG_ZTEST_STACK_SIZE=2048
  kernel.scheduler.multiq:
    extra_args: FILE_SUFFIX=multiq
    extra_configs:
      - CONFIG_TIMESLICING=y
  kernel.scheduler.multiq_no_timeslicing:
    extra_args: FILE_SUFFIX=multiq
    extra_configs:
      - CONFIG_TIMESLICING=n
  kernel.scheduler.simple_timeslicing:
    extra_args: FILE_SUFFIX=simple
    extra_configs:
      - CONFIG_TIMESLICING=y
  kernel.scheduler.simple_no_timeslicing:
    extra_args: FILE_SUFFIX=simple
    extra_configs:
      - CONFIG_TIMESLICING=n
  kernel.scheduler.native_sim_coroutines:
    filter: not CONFIG_SCHED_MULTIQ
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_TIMESLICING=y
      - CONFIG_NATIVE_SIMULATOR_NCT_BACKEND_COROUTINES=y
  kernel.scheduler.native_sim_ucontext:
    filter: not CONFIG_SCHED_MULTIQ
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_TIMESLICING=y
      - CONFIG_NATIVE_SIMULATOR_NCT_BACKEND_COROUTINES=y
      - CONFIG_NATIVE_SIMULATOR_COROUTINE_IMPLEMENTATION_UCONTEXT=y
  kernel.scheduler.native_sim_longjmp:
    filter: not CONFIG_SCHED_MULTIQ
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_TIMESLICING=y
      - CONFIG_NATIVE_SIMULATOR_NCT_BACKEND_COROUTINES=y
      - CONFIG_NATIVE_SIMULATOR_COROUTINE_IMPLEMENTATION_LONGJMP=y
