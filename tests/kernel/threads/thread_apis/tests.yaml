common:
  ignore_faults: true
  tags:
    - kernel
    - threads
    - userspace
tests:
  kernel.threads.apis:
    min_flash: 34
  kernel.threads.apis.cpu_mask:
    min_flash: 34
    depends_on:
      - smp
    extra_configs:
      - CONFIG_SCHED_SIMPLE=y
      - CONFIG_SCHED_CPU_MASK=y
  kernel.threads.apis.pinonly:
    min_flash: 34
    depends_on:
      - smp
    extra_configs:
      - CONFIG_SCHED_SIMPLE=y
      - CONFIG_SCHED_CPU_MASK=y
      - CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
  kernel.threads.apis.native_sim_coroutines:
    min_flash: 34
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_NATIVE_SIMULATOR_NCT_BACKEND_COROUTINES=y
  kernel.threads.apis.native_sim_ucontext:
    min_flash: 34
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
    extra_configs:
      - CONFIG_NATIVE_SIMULATOR_NCT_BACKEND_COROUTINES=y
      - CONFIG_NATIVE_SIMULATOR_COROUTINE_IMPLEMENTATION_UCONTEXT=y
