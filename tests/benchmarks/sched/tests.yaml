tests:
  benchmark.kernel.scheduler:
    platform_key:
      - arch
    tags:
      - benchmark
      - kernel
    integration_platforms:
      - mps2/an385
      - qemu_x86
      - qemu_riscv64/qemu_virt_riscv64/smp
    slow: true
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "unpend\\s+\\d* ready\\s+\\d* switch\\s+\\d* pend\\s+\\d* tot\\s+\\d* \\(avg\\s+\\d*\\)"
        - "fin"
  benchmark.kernel.scheduler.native_sim.pthread:
    platform_allow:
      - native_sim/native/64
    tags:
      - benchmark
      - kernel
      - native_sim
    slow: true
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "unpend\\s+\\d* ready\\s+\\d* switch\\s+\\d* pend\\s+\\d* tot\\s+\\d* \\(avg\\s+\\d*\\)"
        - "fin"
  benchmark.kernel.scheduler.native_sim.fiber:
    platform_allow:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NATIVE_SIMULATOR_NCT_FIBER=y
    tags:
      - benchmark
      - kernel
      - native_sim
    slow: true
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "unpend\\s+\\d* ready\\s+\\d* switch\\s+\\d* pend\\s+\\d* tot\\s+\\d* \\(avg\\s+\\d*\\)"
        - "fin"
